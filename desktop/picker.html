<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; base-uri 'none'"><title>选择共享内容</title><link rel="stylesheet" href="picker.css"></head><body>
<header><h1>选择共享内容</h1><p>选择一个窗口或整个屏幕，确认后开始共享。</p></header>
<nav aria-label="共享类型"><button id="screens" aria-pressed="true">整个屏幕</button><button id="windows" aria-pressed="false">应用窗口</button><button id="refresh">刷新预览</button></nav>
<p id="status" role="status">正在获取预览…</p><main id="sources" aria-label="可共享内容"></main>
<footer><div><label><input id="audio" type="checkbox">共享系统声音</label><p id="audio-note">系统声音可能包含其他应用及会议播放的声音。</p></div><button id="cancel">取消</button><button id="confirm" disabled>共享所选内容</button></footer><script src="picker.js"></script></body></html>
